services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: queenofex
      POSTGRES_PASSWORD: queenofex
      POSTGRES_DB: queenofexcellence
    volumes:
      - queenofex_pgdata:/var/lib/postgresql/data

volumes:
  queenofex_pgdata:
